[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-clock"
version = "0.1.0"
description = "Material Research Clock v0 runtime: deterministic wave emission, material accounting, and single-door workers."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research-clock = "research_clock.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
